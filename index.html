<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>거리 → 시간 예측 AI</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@2.0.0/dist/tf.min.js"></script>

<style>

body{
    margin:0;
    padding:30px;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
    max-width:950px;
    margin:auto;
    background:white;
    border-radius:25px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#333;
}

.desc{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.card{
    background:#f7fbff;
    padding:20px;
    border-radius:20px;
}

.card h2{
    margin-top:0;
    color:#2196f3;
}

.row{
    margin-bottom:10px;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:2px solid #ddd;
    font-size:16px;
    box-sizing:border-box;
}

input:focus{
    border-color:#2196f3;
    outline:none;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
    background:#2196f3;
    color:white;
    transition:0.3s;
    margin-top:20px;
}

button:hover{
    background:#1976d2;
}

button:disabled{
    background:gray;
    cursor:not-allowed;
}

.loading-box{
    text-align:center;
    margin-top:30px;
}

.hourglass{
    font-size:70px;
    display:inline-block;
    animation:spin 1.5s linear infinite;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

.time-text{
    margin-top:15px;
    font-size:24px;
    color:#ff5722;
}

.status{
    margin-top:20px;
    font-size:22px;
    line-height:1.8;
    color:#333;
}

.predict-section{
    display:none;
    margin-top:40px;
    padding:25px;
    border-radius:20px;
    background:#f0fff4;
}

.predict-section h2{
    margin-top:0;
}

.result{
    margin-top:25px;
    text-align:center;
    font-size:40px;
    font-weight:bold;
    color:#2196f3;
}

.footer{
    margin-top:30px;
    text-align:center;
    color:#777;
}

</style>
</head>

<body>

<div class="container">

    <h1>🚀 거리 → 시간 예측 AI</h1>

    <p class="desc">
        우리가 과거의 데이터를 입력하면<br>
        AI가 거리와 시간의 관계를 학습하고 미래를 예측합니다.
    </p>

    <div class="grid">

        <!-- 거리 데이터 -->
        <div class="card">

            <h2>📏 거리 데이터 (cm)</h2>

            <div id="distanceInputs"></div>

        </div>

        <!-- 시간 데이터 -->
        <div class="card">

            <h2>⏱ 시간 데이터 (초)</h2>

            <div id="timeInputs"></div>

        </div>

    </div>

    <!-- 학습 버튼 -->
    <button id="trainBtn" onclick="trainAI()">
        AI 학습 시작
    </button>

    <!-- 학습 상태 -->
    <div class="loading-box" id="loadingBox" style="display:none;">

        <div class="hourglass">
            ⏳
        </div>

        <div class="time-text">
            학습 시간 :
            <span id="elapsed">0</span> 초
        </div>

        <div class="status" id="statusText">

        </div>

    </div>

    <!-- 예측 영역 -->
    <div class="predict-section" id="predictSection">

        <h2>🔮 새로운 거리 예측</h2>

        <input
            type="number"
            id="newDistance"
            placeholder="예: 35"
        >

        <button onclick="predictTime()">
            예상 시간 계산
        </button>

        <div class="result" id="result">
            -
        </div>

    </div>

    <div class="footer">
        TensorFlow.js 머신러닝 실습 ('26.05. 이정열)
    </div>

</div>

<script>

// -------------------------------------
// 입력창 8개 생성
// -------------------------------------

for(let i=0; i<8; i++){

    document.getElementById("distanceInputs").innerHTML += `
        <div class="row">
            <input
                type="number"
                id="d${i}"
                placeholder="거리 ${i+1}"
            >
        </div>
    `;

    document.getElementById("timeInputs").innerHTML += `
        <div class="row">
            <input
                type="number"
                id="t${i}"
                placeholder="시간 ${i+1}"
            >
        </div>
    `;
}


// -------------------------------------
// 기본 샘플 데이터
// -------------------------------------

let sampleDistance =
[7.8, 13, 18.5, 23.5, 31.5, 39.6, 47.5, 55];

let sampleTime =
[3, 5, 7, 9, 12, 15, 18, 21];

for(let i=0; i<8; i++){

    document.getElementById(`d${i}`).value =
        sampleDistance[i];

    document.getElementById(`t${i}`).value =
        sampleTime[i];
}


// -------------------------------------
// 전역 변수
// -------------------------------------

let model = null;

let totalTrainingCount = 0;


// -------------------------------------
// AI 학습 함수
// -------------------------------------

async function trainAI(){

    let 거리 = [];
    let 시간 = [];

    // 입력값 읽기
    for(let i=0; i<8; i++){

        let d =
        Number(document.getElementById(`d${i}`).value);

        let t =
        Number(document.getElementById(`t${i}`).value);

        if(d <= 0 || t <= 0){

            alert("모든 데이터를 입력하세요!");

            return;
        }

        거리.push(d);
        시간.push(t);
    }


    // 버튼 비활성화
    document.getElementById("trainBtn").disabled = true;

    // 로딩 보이기
    document.getElementById("loadingBox").style.display =
        "block";

    // 예측 영역 숨기기
    document.getElementById("predictSection").style.display =
        "none";

    // 모래시계 회전 시작
    document.querySelector(".hourglass").style.animation =
        "spin 1.5s linear infinite";

    document.querySelector(".hourglass").innerHTML =
        "⏳";

    // 상태 초기화
    document.getElementById("statusText").innerHTML =
        "AI 학습 준비중...";


    // 시간 측정 시작
    let startTime = Date.now();

    let timer = setInterval(function(){

        let sec =
        ((Date.now() - startTime)/1000).toFixed(1);

        document.getElementById("elapsed").innerHTML =
            sec;

    },100);


    // -------------------------------------
    // Tensor 생성
    // -------------------------------------

    let 입력값 = tf.tensor(거리);

    let 출력값 = tf.tensor(시간);


    // -------------------------------------
    // 모델이 없을 때만 생성
    // -------------------------------------

    if(!model){

        let X = tf.input({shape:[1]});

        let Y = tf.layers.dense({
            units:1
        }).apply(X);

        model = tf.model({

            inputs:X,

            outputs:Y

        });

        model.compile({

            optimizer:tf.train.adam(0.1),

            loss:tf.losses.meanSquaredError

        });
    }


    // -------------------------------------
    // 자동 반복 학습
    // -------------------------------------

    let 목표오차 = 0.01;

    let 현재오차 = 9999;

    let 재학습횟수 = 0;


    while(true){

        재학습횟수++;

        totalTrainingCount++;

        // 200 epochs 학습
        let result = await model.fit(

            입력값,
            출력값,

            {

                epochs:200,

                shuffle:true,

                verbose:0

            }

        );


        // 현재 loss
        현재오차 =
        result.history.loss[
            result.history.loss.length - 1
        ];


        // 경과 시간
        let sec =
        ((Date.now() - startTime)/1000).toFixed(1);


        // 상태 표시
        document.getElementById("statusText").innerHTML =

        `
        🔄 이번 학습 재반복 :
        ${재학습횟수} 회<br>

        🧠 전체 추가 학습 :
        ${totalTrainingCount} 회<br>

        📉 현재 오차(loss) :
        ${현재오차.toFixed(6)}
        `;


        // 목표 도달
        if(현재오차 < 목표오차){

            break;
        }


        // 최대 시간 제한
        if(sec > 15){

            break;
        }
    }


    // 타이머 종료
    clearInterval(timer);


    // 모래시계 정지
    document.querySelector(".hourglass").style.animation =
        "none";

    // 완료 표시
    document.querySelector(".hourglass").innerHTML =
        "✅";


    // 완료 메시지
    document.getElementById("statusText").innerHTML =

    `
    ✅ AI 학습 완료!<br><br>

    🔄 이번 재학습 횟수 :
    ${재학습횟수} 회<br>

    🧠 전체 누적 학습 :
    ${totalTrainingCount} 회<br>

    📉 최종 오차(loss) :
    ${현재오차.toFixed(6)}
    `;


    // 버튼 이름 변경
    document.getElementById("trainBtn").innerHTML =
        "AI 추가 학습";


    // 버튼 다시 활성화
    document.getElementById("trainBtn").disabled =
        false;


    // 예측 영역 보이기
    document.getElementById("predictSection").style.display =
        "block";
}


// -------------------------------------
// 예측 함수
// -------------------------------------

function predictTime(){

    let newDistance =
    Number(document.getElementById("newDistance").value);

    if(newDistance <= 0){

        alert("거리값을 입력하세요!");

        return;
    }


    // 예측
    let input = tf.tensor([newDistance]);

    let prediction = model.predict(input);

    let result = prediction.dataSync()[0];


    // 결과 출력
    document.getElementById("result").innerHTML =

        result.toFixed(2) + " 초";
}

</script>

</body>
</html>
