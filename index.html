<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>거리 → 시간 예측 AI</title>

<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@2.0.0/dist/tf.min.js"></script>

<style>

body{
    margin:0;
    padding:30px;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
    max-width:950px;
    margin:auto;
    background:white;
    border-radius:25px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#333;
}

.desc{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.card{
    background:#f7fbff;
    padding:20px;
    border-radius:20px;
}

.card h2{
    margin-top:0;
    color:#2196f3;
}

.row{
    margin-bottom:10px;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:2px solid #ddd;
    font-size:16px;
    box-sizing:border-box;
}

input:focus{
    border-color:#2196f3;
    outline:none;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
    background:#2196f3;
    color:white;
    transition:0.3s;
    margin-top:20px;
}

button:hover{
    background:#1976d2;
}

button:disabled{
    background:gray;
    cursor:not-allowed;
}

.loading-box{
    text-align:center;
    margin-top:30px;
}

.hourglass{
    font-size:70px;
    display:inline-block;
    animation:spin 1.5s linear infinite;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

.time-text{
    margin-top:15px;
    font-size:24px;
    color:#ff5722;
}

.status{
    margin-top:20px;
    font-size:22px;
    line-height:1.8;
    color:#333;
}

.predict-section{
    display:none;
    margin-top:40px;
    padding:25px;
    border-radius:20px;
    background:#f0fff4;
}

.predict-section h2{
    margin-top:0;
}

.result{
    margin-top:25px;
    text-align:center;
    font-size:40px;
    font-weight:bold;
    color:#2196f3;
}

.footer{
    margin-top:30px;
    text-align:center;
    color:#777;
}

</style>
</head>

<body>

<div class="container">

    <h1>🚀 거리 → 시간 예측 AI ('26.05.06.수정초)</h1>

    <p class="desc">
        우리가 과거의 데이터를 입력하면<br>
        AI가 거리와 시간의 관계를 학습하고 미래를 예측합니다.
    </p>

    <div class="grid">

        <!-- 거리 데이터 -->
        <div class="card">

            <h2>📏 거리 데이터 (cm)</h2>

            <div id="distanceInputs"></div>

        </div>

        <!-- 시간 데이터 -->
        <div class="card">

            <h2>⏱ 시간 데이터 (초)</h2>

            <div id="timeInputs"></div>

        </div>

    </div>

    <!-- 학습 버튼 -->
    <button id="trainBtn" onclick="trainAI()">
        AI 학습 시작
    </button>

    <!-- 학습 상태 -->
    <div class="loading-box" id="loadingBox" style="display:none;">

        <div class="hourglass">
            ⏳
        </div>

        <div class="time-text">
            학습 시간 :
            <span id="elapsed">0</span> 초
        </div>

        <div class="status" id="statusText">

        </div>

    </div>

    <!-- 예측 영역 -->
    <div class="predict-section" id="predictSection">

        <h2>🔮 새로운 거리 예측</h2>

        <input
            type="number"
            id="newDistance"
            placeholder="예: 35"
        >

        <button onclick="predictTime()">
            예상 시간 계산
        </button>

        <div class="result" id="result">
            -
        </div>

    </div>

    <div class="footer">
        TensorFlow.js 머신러닝 실습
    </div>

</div>

<script>

// -------------------------------------
// 입력창 8개 생성
// -------------------------------------

for(let i=0; i<8; i++){

    document.getElementById("distanceInputs").innerHTML += `
        <div class="row">
            <input
                type="number"
                id="d${i}"
                placeholder="거리 ${i+1}"
            >
        </div>
    `;

    document.getElementById("timeInputs").innerHTML += `
        <div class="row">
            <input
                type="number"
                id="t${i}"
                placeholder="시간 ${i+1}"
            >
        </div>
    `;
}


// -------------------------------------
// 기본 예제 데이터 자동 입력
// -------------------------------------

let sampleDistance =
[7.8, 13, 18.5, 23.5, 31.5, 39.6, 47.5, 55];

let sampleTime =
[3, 5, 7, 9, 12, 15, 18, 21];

for(let i=0; i<8; i++){

    document.getElementById(`d${i}`).value =
        sampleDistance[i];

    document.getElementById(`t${i}`).value =
        sampleTime[i];
}


// -------------------------------------
// 전역 모델
// -------------------------------------

let model;


// -------------------------------------
// AI 학습 함수
// -------------------------------------

async function trainAI(){

    let 거리 = [];
    let 시간 = [];

    // 입력값 읽기
    for(let i=0; i<8; i++){

        let d =
        Number(document.getElementById(`d${i}`).value);

        let t =
        Number(document.getElementById(`t${i}`).value);

        if(d <= 0 || t <= 0){

            alert("모든 데이터를 입력하세요!");

            return;
        }

        거리.push(d);
        시간.push(t);
    }


    // 버튼 비활성화
    document.getElementById("trainBtn").disabled = true;

    // 로딩창 보이기
    document.getElementById("loadingBox").style.display =
        "block";

    // 이전 상태 초기화
    document.getElementById("statusText").innerHTML =
        "AI 준비중...";

    // 모래시계 회전 다시 시작
    document.querySelector(".hourglass").style.animation =
        "spin 1.5s linear infinite";

    document.querySelector(".hourglass").innerHTML =
        "⏳";


    // 시간 측정
    let startTime = Date.now();

    let timer = setInterval(function(){

        let sec =
        ((Date.now() - startTime)/1000).toFixed(1);

        document.getElementById("elapsed").innerHTML =
            sec;

    },100);


    // -------------------------------------
    // Tensor 생성
    // -------------------------------------

    let 입력값 = tf.tensor(거리);

    let 출력값 = tf.tensor(시간);


    // -------------------------------------
    // 모델 생성
    // -------------------------------------

    let X = tf.input({shape:[1]});

    let Y = tf.layers.dense({
        units:1
    }).apply(X);

    model = tf.model({
        inputs:X,
        outputs:Y
    });


    // -------------------------------------
    // 모델 설정
    // -------------------------------------

    model.compile({

        optimizer:tf.train.adam(0.1),

        loss:tf.losses.meanSquaredError

    });


    // -------------------------------------
    // 자동 반복 학습
    // -------------------------------------

    let 목표오차 = 0.05;

    let 현재오차 = 9999;

    let 반복횟수 = 0;


    while(true){

        반복횟수++;

        // 200번씩 반복 학습
        let result = await model.fit(

            입력값,
            출력값,

            {
                epochs:200,
                shuffle:true,
                verbose:0
            }

        );

        // 마지막 loss
        현재오차 =
        result.history.loss[
            result.history.loss.length - 1
        ];


        // 현재 경과시간
        let sec =
        ((Date.now() - startTime)/1000).toFixed(1);


        // 상태 표시
        document.getElementById("statusText").innerHTML =

        `
        🔄 재학습 횟수 : ${반복횟수} 회<br>
        📉 현재 오차(loss) :
        ${현재오차.toFixed(5)}
        `;


        // 목표 성능 도달
        if(현재오차 < 목표오차){

            break;
        }


        // 너무 오래 학습 방지
        if(sec > 15){

            break;
        }
    }


    // 타이머 종료
    clearInterval(timer);


    // 모래시계 멈춤
    document.querySelector(".hourglass").style.animation =
        "none";

    // 완료 표시
    document.querySelector(".hourglass").innerHTML =
        "✅";


    // 완료 메시지
    document.getElementById("statusText").innerHTML =

    `
    ✅ AI 학습 완료!<br>
    🔄 재학습 횟수 :
    ${반복횟수} 회<br>
    📉 최종 오차(loss) :
    ${현재오차.toFixed(5)}
    `;


    // 예측 영역 보이기
    document.getElementById("predictSection").style.display =
        "block";


    // 버튼 다시 활성화
    document.getElementById("trainBtn").disabled = false;
}


// -------------------------------------
// 예측 함수
// -------------------------------------

function predictTime(){

    let newDistance =
    Number(document.getElementById("newDistance").value);

    if(newDistance <= 0){

        alert("거리값을 입력하세요!");

        return;
    }

    // 예측
    let input = tf.tensor([newDistance]);

    let prediction = model.predict(input);

    let result = prediction.dataSync()[0];


    // 결과 출력
    document.getElementById("result").innerHTML =

        result.toFixed(2) + " 초";
}

</script>

</body>
</html>
